appId: com.corp.mobile-remote-toolkit
productName: Mobile Remote Toolkit
copyright: Copyright © 2026

# Output directory
directories:
  buildResources: resources
  output: dist-electron-test

# Files included in the app package
files:
  - out/**/*
  - node_modules/**/*
  - "!src/**"
  - "!electron/**"

# Extra resources bundled alongside the app (not inside the asar)
extraResources:
  - from: ../../Mobile.Remote.Toolkit.Api/publish
    to: api
    filter:
      - "**/*"

# Windows target
win:
  signAndEditExecutable: false
  signExts: []
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64

# NSIS installer config
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Compression
compression: maximum
